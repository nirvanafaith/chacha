[package]
name = "chacha"
version = "2.1.0"
authors = ["chacha"]
edition = "2018"
description = "CHACHA 文件夹加密/解密（XP~11，XChaCha20-Poly1305）"
build = false

[lib]
name = "chacha"
path = "src/lib.rs"

[[bin]]
name = "chacha-enc"
path = "src/bin_enc.rs"

[[bin]]
name = "chacha-dec"
path = "src/bin_dec.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false

[profile.dev]
panic = "abort"
opt-level = 2
